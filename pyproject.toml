[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "1.0.0"
description = "Stream logs into ranked incidents: template mining, spike detection and root-cause evidence in one offline Python CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kele" }]
keywords = ["logs", "observability", "anomaly-detection", "incident-response", "sre", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
logscope = "logscope.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP031 is off on purpose: the renderers use %-formatting for speed and for
# readable multi-line table templates, and every call site is a constant string.
ignore = ["E501", "UP031"]